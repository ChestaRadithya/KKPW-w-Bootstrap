<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="col-12 col-md-5 col-lg-4">
            
            <h1 class="fw-bold text-center mb-4">Login</h1>
            
            <form class="bg-white border border-2 border-dark rounded-4 p-4 shadow">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Username</label>
                    <input type="text" class="form-control" placeholder="Masukkan username" id="user_input">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Password</label>
                    <input type="password" class="form-control" placeholder="Masukkan password" id="user_pass">
                </div>
                <div class="mb-3">
                    <input class="form-check-input" type="checkbox" id="remember">
                    <label class="form-check-label" for="remember"> Ingat aku</label>
                </div>
                <div class="d-grid">
                    <button class="btn btn-warning btn-lg fw-bold" id="login">Login</button>
                </div>
                <div class="mt-3 text-center">
                    <p>Belum punya akun? <a href="register.html" class="text-decoration-none">Daftar sekarang</a></p>
                </div>
            </form>

            <script src="login.js"></script>
            
        </div>
    </div>
</body>
</html>
